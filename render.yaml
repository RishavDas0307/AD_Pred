services:
  - type: web
    name: ad-pred-api
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: FRONTEND_URL
        value: https://ad-pred.vercel.app
      - key: CORS_ALLOW_ALL
        value: "false"
